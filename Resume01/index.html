<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dynamic Resume</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --navy: #1f354d;
      --teal: #3b949e;
      --light-bg: #f5f6f8;
      --text-dark: #222222;
      --text-muted: #666666;
      --pill-bg: #8c9fae;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      background-color: #e5e5e5;
      color: var(--text-dark);
      line-height: 1.4;
      padding: 20px;
    }

    .resume-container {
      max-width: 850px;
      margin: 0 auto;
      background: #ffffff;
      box-shadow: 0 4px 15px rgba(0,0,0,0.15);
    }

    /* Header Styling */
    header {
      background: var(--navy);
      color: white;
      padding: 24px 30px;
      position: relative;
    }

    .header-top {
      display: flex;
      align-items: center;
      gap: 24px;
      margin-bottom: 20px;
    }

    .profile-img {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid var(--teal);
      flex-shrink: 0;
    }

    .header-text h1 {
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 2px;
    }

    .header-text .subtitle {
      color: var(--teal);
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .header-text .summary {
      font-size: 0.82rem;
      color: #d1d9e0;
      line-height: 1.45;
    }

    .contact-bar {
      background: var(--teal);
      margin: 0 -30px -24px -30px;
      padding: 10px 30px;
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      font-size: 0.85rem;
    }

    .contact-item {
      display: flex;
      align-items: center;
      gap: 8px;
      color: white;
      text-decoration: none;
    }

    .contact-item i {
      font-size: 0.95rem;
    }

    /* Main Grid Layout */
    .content-grid {
      display: grid;
      grid-template-columns: 1.6fr 1fr;
    }

    .left-column {
      padding: 24px 24px 24px 30px;
      border-right: 1px solid #e0e0e0;
    }

    .right-column {
      padding: 24px 30px 24px 20px;
      background-color: #fafafa;
    }

    /* Section Headers */
    .section-title {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--navy);
      font-size: 1.05rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 14px;
    }

    .section-title i {
      background: var(--navy);
      color: white;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
    }

    section {
      margin-bottom: 22px;
    }

    /* Work Experience */
    .job-item {
      margin-bottom: 16px;
    }

    .job-title {
      font-weight: 700;
      font-size: 0.98rem;
      color: #111;
    }

    .job-company {
      font-weight: 600;
      font-size: 0.9rem;
      color: #333;
    }

    .job-period {
      font-size: 0.75rem;
      color: var(--teal);
      font-weight: 600;
      margin-bottom: 6px;
    }

    .bullet-list {
      list-style: none;
      padding-left: 0;
    }

    .bullet-list li {
      position: relative;
      padding-left: 14px;
      font-size: 0.82rem;
      color: #444;
      margin-bottom: 5px;
      line-height: 1.4;
    }

    .bullet-list li::before {
      content: "•";
      color: var(--teal);
      font-weight: bold;
      position: absolute;
      left: 0;
      top: 0;
    }

    /* Workshops */
    .workshop-item {
      margin-bottom: 12px;
    }

    .workshop-title {
      font-weight: 700;
      font-size: 0.9rem;
      color: #111;
    }

    .workshop-instructor {
      font-size: 0.82rem;
      font-weight: 600;
      color: #444;
    }

    .workshop-meta {
      font-size: 0.75rem;
      color: #888;
      font-style: italic;
    }

    /* Right Column Items */
    .skill-list {
      list-style: none;
    }

    .skill-list li {
      font-size: 0.85rem;
      color: #333;
      margin-bottom: 6px;
    }

    .soft-skills-container {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .soft-skill-pill {
      background: var(--pill-bg);
      color: white;
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 0.78rem;
      font-weight: 500;
    }

    .edu-degree {
      font-weight: 700;
      font-size: 0.9rem;
      color: #111;
    }

    .edu-school {
      font-weight: 600;
      font-size: 0.85rem;
      color: #333;
    }

    .edu-location {
      font-size: 0.75rem;
      color: #888;
      font-style: italic;
    }

    .lang-item {
      margin-bottom: 8px;
    }

    .lang-name {
      font-weight: 700;
      font-size: 0.85rem;
      color: #111;
    }

    .lang-level {
      font-size: 0.75rem;
      color: #777;
      font-style: italic;
    }

    @media print {
      body {
        background: white;
        padding: 0;
      }
      .resume-container {
        box-shadow: none;
      }
    }
  </style>
</head>
<body>

  <div class="resume-container" id="resume">
    <!-- Rendered via JavaScript from resume.json -->
  </div>

  <script>
    async function renderResume() {
      try {
        const response = await fetch('resume.json?v=' + new Date().getTime());
        if (!response.ok) throw new Error(`HTTP error! Status: ${response.status}`);
        const data = await response.json();

        const contact = data.contact || data.basics || {};
        const email = contact.email || '';
        const phone = contact.phone || '';
        const location = contact.location || '';
        const instagram = contact.instagram || contact.website || '';
        
        // Fallback default avatar if profileImage isn't supplied in JSON
        const profileImage = data.profileImage || 'https://via.placeholder.com/100';

        const container = document.getElementById('resume');
        container.innerHTML = `
          <header>
            <div class="header-top">
              <img src="${profileImage}" alt="${data.name || ''}" class="profile-img">
              <div class="header-text">
                <h1>${data.name || contact.name || ''}</h1>
                <div class="subtitle">${data.title || contact.label || ''}</div>
                <p class="summary">${data.summary || contact.summary || ''}</p>
              </div>
            </div>
            <div class="contact-bar">
              ${email ? `<div class="contact-item"><i class="fa-solid fa-envelope"></i> ${email}</div>` : ''}
              ${phone ? `<div class="contact-item"><i class="fa-solid fa-phone"></i> ${phone}</div>` : ''}
              ${location ? `<div class="contact-item"><i class="fa-solid fa-location-dot"></i> ${location}</div>` : ''}
              ${instagram ? `<div class="contact-item"><i class="fa-brands fa-instagram"></i> ${instagram}</div>` : ''}
            </div>
          </header>

          <div class="content-grid">
            <div class="left-column">
              <section>
                <div class="section-title">
                  <i class="fa-solid fa-briefcase"></i>
                  <span>Work Experience</span>
                </div>
                ${(data.workExperience || data.work || []).map(job => `
                  <div class="job-item">
                    <div class="job-title">${job.role || job.position || ''}</div>
                    <div class="job-company">${job.company || ''}</div>
                    <div class="job-period">${job.period || (job.startDate ? `${job.startDate} - ${job.endDate}` : '')}</div>
                    <ul class="bullet-list">
                      ${(job.bullets || job.highlights || []).map(b => `<li>${b}</li>`).join('')}
                    </ul>
                  </div>
                `).join('')}
              </section>

              ${data.workshops ? `
              <section>
                <div class="section-title">
                  <i class="fa-solid fa-masks-theater"></i>
                  <span>Workshops & Training Camps</span>
                </div>
                ${data.workshops.map(ws => `
                  <div class="workshop-item">
                    <div class="workshop-title">${ws.title}</div>
                    <div class="workshop-instructor">${ws.instructor}</div>
                    <div class="workshop-meta">${ws.date}</div>
                    <div class="workshop-meta">${ws.location}</div>
                  </div>
                `).join('')}
              </section>
              ` : ''}
            </div>

            <div class="right-column">
              <section>
                <div class="section-title">
                  <i class="fa-solid fa-brain"></i>
                  <span>Hard Skills</span>
                </div>
                <ul class="skill-list">
                  ${(data.hardSkills || data.skills || []).map(skill => `<li>${skill}</li>`).join('')}
                </ul>
              </section>

              ${data.softSkills ? `
              <section>
                <div class="section-title">
                  <i class="fa-solid fa-lightbulb"></i>
                  <span>Soft Skills</span>
                </div>
                <div class="soft-skills-container">
                  ${data.softSkills.map(skill => `<span class="soft-skill-pill">${skill}</span>`).join('')}
                </div>
              </section>
              ` : ''}

              <section>
                <div class="section-title">
                  <i class="fa-solid fa-graduation-cap"></i>
                  <span>Education</span>
                </div>
                ${(data.education || []).map(edu => `
                  <div class="edu-item">
                    <div class="edu-degree">${edu.degree || `${edu.studyType || ''} in ${edu.area || ''}`}</div>
                    <div class="edu-school">${edu.institution || ''}</div>
                    <div class="edu-location">${edu.location || edu.endDate || ''}</div>
                  </div>
                `).join('')}
              </section>

              ${data.languages ? `
              <section>
                <div class="section-title">
                  <i class="fa-solid fa-language"></i>
                  <span>Languages</span>
                </div>
                ${data.languages.map(lang => `
                  <div class="lang-item">
                    <div class="lang-name">${lang.language}</div>
                    <div class="lang-level">${lang.level}</div>
                  </div>
                `).join('')}
              </section>
              ` : ''}
            </div>
          </div>
        `;
      } catch (err) {
        document.getElementById('resume').innerHTML = `<p style="color:red; padding:20px;">Failed to load resume data: ${err.message}</p>`;
      }
    }

    renderResume();
  </script>
</body>
</html>
