<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dynamic Resume</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; line-height: 1.6; color: #333; background: #f4f4f5; padding: 20px; }
    .resume-card { max-width: 800px; margin: 0 auto; background: #fff; padding: 40px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
    
    header { border-bottom: 2px solid #eaeaea; padding-bottom: 20px; margin-bottom: 20px; }
    h1 { font-size: 2rem; color: #111; }
    .title { font-size: 1.1rem; color: #666; font-weight: 500; }
    .contact-info { margin-top: 10px; font-size: 0.9rem; color: #444; display: flex; gap: 15px; flex-wrap: wrap; }
    
    section { margin-bottom: 25px; }
    h2 { font-size: 1.2rem; text-transform: uppercase; letter-spacing: 1px; color: #2563eb; margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 4px; }
    
    .skills-list { display: flex; flex-wrap: wrap; gap: 8px; list-style: none; }
    .skills-list li { background: #eff6ff; color: #1d4ed8; padding: 4px 10px; border-radius: 4px; font-size: 0.85rem; font-weight: 500; }
    
    .item { margin-bottom: 15px; }
    .item-header { display: flex; justify-content: space-between; font-weight: bold; }
    .item-sub { color: #666; font-style: italic; font-size: 0.9rem; margin-bottom: 5px; }
    ul.highlights { margin-left: 20px; font-size: 0.95rem; }

    @media print {
      body { background: #fff; padding: 0; }
      .resume-card { box-shadow: none; padding: 0; }
    }
  </style>
</head>
<body>

  <article class="resume-card" id="resume">
    <p>Loading resume data...</p>
  </article>

  <script>
    async function loadResume() {
      try {
        const response = await fetch('resume.json');
        if (!response.ok) throw new Error('Failed to fetch resume JSON');
        const data = await response.json();
        
        renderResume(data);
      } catch (error) {
        document.getElementById('resume').innerHTML = `<p style="color:red;">Error loading resume data. (Note: Run via a local server like Live Server to satisfy browser fetch/CORS policies).</p>`;
        console.error(error);
      }
    }

    function renderResume(data) {
      const container = document.getElementById('resume');
      
      container.innerHTML = `
        <header>
          <h1>${data.basics.name}</h1>
          <div class="title">${data.basics.label}</div>
          <div class="contact-info">
            <span>${data.basics.email}</span> |
            <span>${data.basics.phone}</span> |
            <a href="${data.basics.website}" target="_blank">${data.basics.website}</a>
          </div>
        </header>

        <section>
          <h2>Summary</h2>
          <p>${data.basics.summary}</p>
        </section>

        <section>
          <h2>Skills</h2>
          <ul class="skills-list">
            ${data.skills.map(skill => `<li>${skill}</li>`).join('')}
          </ul>
        </section>

        <section>
          <h2>Experience</h2>
          ${data.work.map(job => `
            <div class="item">
              <div class="item-header">
                <span>${job.position}</span>
                <span>${job.startDate} – ${job.endDate}</span>
              </div>
              <div class="item-sub">${job.company}</div>
              <ul class="highlights">
                ${job.highlights.map(h => `<li>${h}</li>`).join('')}
              </ul>
            </div>
          `).join('')}
        </section>

        <section>
          <h2>Education</h2>
          ${data.education.map(edu => `
            <div class="item">
              <div class="item-header">
                <span>${edu.studyType} in ${edu.area}</span>
                <span>${edu.endDate}</span>
              </div>
              <div class="item-sub">${edu.institution}</div>
            </div>
          `).join('')}
        </section>
      `;
    }

    loadResume();
  </script>
</body>
</html>
